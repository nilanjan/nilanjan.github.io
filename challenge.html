<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 120px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: system-ui, sans-serif;
        background: transparent;
      }
      #status {
        font-size: 13px;
        color: #444;
        text-align: center;
        max-width: 22rem;
        line-height: 1.45;
      }
      #status.err {
        color: #b91c1c;
      }
      .cf-turnstile {
        min-height: 65px;
      }
    </style>
  </head>
  <body>
    <p id="status">Loading challenge…</p>
    <div id="widget-mount"></div>
    <script>
      ;(function () {
        var parentOrigin = window.location.origin
        var sitekey = '0x4AAAAAADWaE0yOOQJjck_o'
        var status = document.getElementById('status')
        var mount = document.getElementById('widget-mount')
        var timeoutId

        function notifyParent(payload) {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(payload, parentOrigin)
            return
          }
          if (window.parent !== window) {
            window.parent.postMessage(payload, parentOrigin)
          }
        }

        function fail(msg) {
          clearTimeout(timeoutId)
          status.textContent = msg
          status.className = 'err'
          notifyParent({ type: 'turnstile-error', message: msg })
        }

        if (!sitekey || sitekey.indexOf('__TURNSTILE') === 0) {
          fail('Verification is not configured for this deployment.')
          return
        }

        var widget = document.createElement('div')
        widget.className = 'cf-turnstile'
        widget.setAttribute('data-sitekey', sitekey)
        widget.setAttribute('data-theme', 'auto')
        widget.setAttribute('data-callback', 'onTurnstileSuccess')
        widget.setAttribute('data-error-callback', 'onTurnstileError')
        mount.appendChild(widget)

        window.onTurnstileSuccess = function (token) {
          clearTimeout(timeoutId)
          status.textContent = ''
          notifyParent({ type: 'turnstile-token', token: token })
          if (window.opener && !window.opener.closed) {
            status.textContent = 'Verified. Returning to site…'
            setTimeout(function () {
              window.close()
            }, 400)
          }
        }

        window.onTurnstileError = function () {
          fail('Turnstile could not run on this page. Reload and try again.')
        }

        timeoutId = setTimeout(function () {
          if (!window.turnstile) {
            fail('Turnstile did not start. Reload and try again.')
          }
        }, 35000)
      })()
    </script>
  </body>
</html>
