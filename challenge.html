<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0.25rem 0.5rem;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #status {
        margin: 0 0 0.35rem;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        color: #6f6654;
      }
      #status.err {
        color: #9f1239;
      }
      #widget-mount {
        width: 100%;
        max-width: 100%;
        display: flex;
        justify-content: center;
      }
      .cf-turnstile {
        width: 100%;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <p id="status" hidden>Loading…</p>
    <div id="widget-mount"></div>
    <script>
      ;(function () {
        var parentOrigin = window.location.origin
        var sitekey = '0x4AAAAAADWaE0yOOQJjck_o'
        var status = document.getElementById('status')
        var mount = document.getElementById('widget-mount')
        var timeoutId

        function notifyParent(payload) {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(payload, parentOrigin)
            return
          }
          if (window.parent !== window) {
            window.parent.postMessage(payload, parentOrigin)
          }
        }

        function reportHeight() {
          var height = Math.ceil(document.documentElement.scrollHeight || document.body.scrollHeight)
          notifyParent({ type: 'turnstile-resize', height: height })
        }

        function fail(msg) {
          clearTimeout(timeoutId)
          status.hidden = false
          status.textContent = msg
          status.className = 'err'
          notifyParent({ type: 'turnstile-error', message: msg })
          reportHeight()
        }

        if (!sitekey || sitekey.indexOf('__TURNSTILE') === 0) {
          fail('Verification is not configured for this deployment.')
          return
        }

        var widget = document.createElement('div')
        widget.className = 'cf-turnstile'
        widget.setAttribute('data-sitekey', sitekey)
        widget.setAttribute('data-theme', 'auto')
        widget.setAttribute('data-size', 'flexible')
        widget.setAttribute('data-callback', 'onTurnstileSuccess')
        widget.setAttribute('data-error-callback', 'onTurnstileError')
        mount.appendChild(widget)

        window.onTurnstileSuccess = function (token) {
          clearTimeout(timeoutId)
          status.hidden = true
          status.textContent = ''
          notifyParent({ type: 'turnstile-token', token: token })
          reportHeight()
          if (window.opener && !window.opener.closed) {
            setTimeout(function () {
              window.close()
            }, 400)
          }
        }

        window.onTurnstileError = function () {
          fail('Turnstile could not run. Reload and try again.')
        }

        timeoutId = setTimeout(function () {
          if (!window.turnstile) {
            fail('Turnstile did not start. Reload and try again.')
          }
        }, 35000)

        if (typeof ResizeObserver !== 'undefined') {
          new ResizeObserver(reportHeight).observe(document.body)
        }
        window.addEventListener('load', reportHeight)
        setTimeout(reportHeight, 100)
        setTimeout(reportHeight, 500)
      })()
    </script>
  </body>
</html>
