    <script>
      (function () {
        try {
          var consent = localStorage.getItem('cookie-consent');
          var theme = consent === 'accepted' ? localStorage.getItem('theme') : null;
          var dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#100e08' : '#f8f4e8');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <script>
      (function () {
        var ua = navigator.userAgent.toLowerCase();
        var blocked = [
          'gptbot', 'chatgpt-user', 'claudebot', 'claude-web', 'anthropic',
          'google-extended', 'ccbot', 'bytespider', 'perplexitybot', 'amazonbot',
          'cohere-ai', 'diffbot', 'headlesschrome', 'scrapy'
        ];
        if (navigator.webdriver || blocked.some(function (b) { return ua.indexOf(b) !== -1; })) {
          document.body.innerHTML =
            '<main style="font-family:system-ui,sans-serif;padding:2rem;max-width:40rem;margin:auto;">' +
            '<h1>Access restricted</h1>' +
            '<p>Automated access is not permitted. This site is for manual human visitors only.</p>' +
            '</main>';
          throw new Error('automated access blocked');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
